<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Explorer — Factors & Multiples</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0f4ff;
    --card: #ffffff;
    --primary: #4361ee;
    --primary-dark: #2d46c4;
    --accent: #f72585;
    --accent2: #7209b7;
    --text: #1a1a2e;
    --muted: #6b7280;
    --border: #d1d5db;
    --shadow: 0 4px 20px rgba(67,97,238,0.15);
    --radius: 14px;
    --grid-border: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: auto;
  }

  /* ── BACKGROUND DECORATION ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(67,97,238,0.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 75%, rgba(247,37,133,0.07) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(114,9,183,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── START SCREEN ── */
  #start-screen {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    gap: 0;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: floatIn 0.7s ease both;
  }

  .logo-emoji {
    font-size: 4rem;
    display: block;
    margin-bottom: 0.4rem;
    animation: bounce 2.5s ease-in-out infinite;
  }

  @keyframes bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .logo-title {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--primary);
    line-height: 1.1;
    letter-spacing: 0.5px;
  }

  .logo-subtitle {
    font-size: 1.05rem;
    color: var(--muted);
    margin-top: 0.3rem;
    font-weight: 600;
  }

  .start-card {
    background: var(--card);
    border-radius: 24px;
    padding: 2.5rem 3rem;
    box-shadow: var(--shadow), 0 1px 3px rgba(0,0,0,0.06);
    max-width: 480px;
    width: 100%;
    animation: floatIn 0.7s ease 0.15s both;
  }

  @keyframes floatIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .setting-label {
    font-size: 0.8rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .grid-options {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 2rem;
  }

  .grid-opt {
    flex: 1;
    padding: 0.9rem 0.5rem;
    border: 2.5px solid var(--border);
    border-radius: 12px;
    background: #f8fafc;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    font-family: 'Nunito', sans-serif;
  }

  .grid-opt .opt-size {
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    color: var(--text);
    display: block;
    line-height: 1;
  }

  .grid-opt .opt-label {
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 700;
    margin-top: 0.25rem;
  }

  .grid-opt:hover {
    border-color: var(--primary);
    background: #eef1ff;
  }

  .grid-opt.selected {
    border-color: var(--primary);
    background: linear-gradient(135deg, #eef1ff, #e0e7ff);
    box-shadow: 0 0 0 3px rgba(67,97,238,0.15);
  }

  .grid-opt.selected .opt-size { color: var(--primary); }

  .lets-go-btn {
    width: 100%;
    padding: 1.1rem;
    font-family: 'Fredoka One', cursive;
    font-size: 1.5rem;
    letter-spacing: 1px;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--accent2));
    border: none;
    border-radius: 14px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(67,97,238,0.35);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .lets-go-btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }

  .lets-go-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(67,97,238,0.45);
  }

  .lets-go-btn:active { transform: translateY(0); }

  /* ── EXPLORER SCREEN ── */
  #explorer-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
    position: relative; z-index: 1;
  }

  .top-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .app-title-small {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    color: var(--primary);
  }

  .mode-btns {
    display: flex;
    gap: 0.5rem;
  }

  .mode-btn {
    padding: 0.55rem 1.1rem;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: var(--card);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }

  .mode-btn:hover { border-color: var(--primary); color: var(--primary); }
  .mode-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
    box-shadow: 0 3px 12px rgba(67,97,238,0.3);
  }

  .back-btn {
    padding: 0.5rem 1rem;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── INSTRUCTION BANNER ── */
  .instruction-banner {
    width: 100%;
    max-width: 900px;
    background: white;
    border-radius: 12px;
    padding: 0.7rem 1.2rem;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 1rem;
    border: 2px solid #e0e7ff;
    box-shadow: 0 2px 8px rgba(67,97,238,0.08);
    text-align: center;
    transition: all 0.3s;
  }

  /* ── CLEAR BUTTON ── */
  .clear-btn {
    padding: 0.55rem 1.2rem;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    color: #ef4444;
    cursor: pointer;
    transition: all 0.18s;
  }
  .clear-btn:hover { background: #fef2f2; border-color: #ef4444; }

  /* ── LEGEND ── */
  #multiples-legend {
    width: 100%;
    max-width: 900px;
    display: none;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    padding: 0.6rem 0.8rem;
    background: white;
    border-radius: 12px;
    border: 2px solid var(--border);
  }

  .legend-item {
    display: flex; align-items: center; gap: 0.35rem;
    font-size: 0.8rem; font-weight: 800;
    padding: 0.25rem 0.6rem;
    border-radius: 50px;
    background: #f8fafc;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .legend-item:hover { opacity: 0.7; }

  .legend-dot {
    width: 12px; height: 12px; border-radius: 50%;
    flex-shrink: 0;
  }

  /* ── GRID ── */
  #grid-wrap {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 0.5rem;
  }

  #number-grid {
    display: grid;
    gap: 4px;
    /* width is set by JS to gridSize * CELL_SIZE + gaps */
  }

  /* ── CELL ── */
  .cell {
    width: var(--cell-size);
    height: var(--cell-size);
    background: white;
    border: 2px solid var(--grid-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    user-select: none;
  }

  .cell:hover { border-color: var(--primary); box-shadow: 0 2px 10px rgba(67,97,238,0.18); z-index: 2; }

  .cell.selected {
    border-color: var(--primary);
    background: #eef1ff;
    box-shadow: 0 0 0 2px rgba(67,97,238,0.2), 0 3px 12px rgba(67,97,238,0.2);
    z-index: 2;
  }

  /* ── NUMBER LABEL ── */
  /* Normal state: centered by parent flex */
  .cell-number {
    font-family: 'Fredoka One', cursive;
    font-size: var(--num-size);
    line-height: 1;
    color: var(--text);
    position: relative;
    z-index: 1;
  }

  /* Selected state: pin to top-center absolutely so it can't interfere with factor centering */
  .cell.selected .cell-number {
    position: absolute;
    top: 4px;
    left: 0; right: 0;
    text-align: center;
    font-family: 'Nunito', sans-serif;
    font-size: calc(var(--num-size-small) * 1.35);
    font-weight: 900;
    color: var(--primary);
    text-shadow: 0 0 1px var(--primary);
    z-index: 2;
  }

  /* ── FACTOR LIST (inside cell) ── */
  /* Hidden by default */
  .factor-list {
    display: none;
  }

  /* Selected state: absolutely fill the cell, flex-center the chips,
     top padding reserves space for the number label above */
  .cell.selected .factor-list {
    display: flex;
    position: absolute;
    inset: 0;
    padding-top: var(--num-size-small);
    flex-wrap: wrap;
    justify-content: center;
    align-content: center;
    gap: 1px;
    overflow: hidden;
    z-index: 1;
  }

  .factor-chip {
    font-size: var(--chip-size);
    font-weight: 900;
    color: var(--primary-dark);
    border-radius: 3px;
    padding: 1px 2px;
    line-height: 1.2;
    white-space: nowrap;
  }

  /* ── CORNER TRIANGLE (multiples mode) ── */
  .corner-trigger {
    display: none;
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 var(--tri-size) var(--tri-size) 0;
    border-color: transparent #94a3b8 transparent transparent;
    cursor: pointer;
    transition: border-color 0.15s;
    z-index: 3;
  }

  .corner-trigger:hover { border-color: transparent var(--primary) transparent transparent; }

  .mode-multiples .corner-trigger { display: block; }

  /* ── MULTIPLE DOTS ── */
  .dots-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 2px 2px 2px 3px;
    gap: 2px;
    pointer-events: none;
    z-index: 2;
  }

  .m-dot {
    width: var(--dot-size); height: var(--dot-size);
    border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.92;
  }

  /* ── ANIMATIONS ── */
  @keyframes popIn {
    0%   { transform: scale(0); opacity: 0; }
    70%  { transform: scale(1.3); }
    100% { transform: scale(1); opacity: 1; }
  }

  .m-dot { animation: popIn 0.25s ease both; }

  /* ── CONTROLS ROW ── */
  .controls-row {
    width: 100%;
    max-width: 900px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .start-card { padding: 2rem 1.5rem; }
    .mode-btn { font-size: 0.78rem; padding: 0.45rem 0.8rem; }
  }
</style>
</head>
<body>

<!-- ══════════════ START SCREEN ══════════════ -->
<div id="start-screen">
  <div class="logo-area">
    <span class="logo-emoji">🔢</span>
    <div class="logo-title">Factors and Multiples Explorer</div>
  </div>

  <div class="start-card">
    <div class="setting-label">Choose your grid size</div>
    <div class="grid-options">
      <button class="grid-opt" data-size="5" onclick="selectGrid(this)">
        <span class="opt-size">5×5</span>
        <span class="opt-label">25 numbers</span>
      </button>
      <button class="grid-opt selected" data-size="10" onclick="selectGrid(this)">
        <span class="opt-size">10×10</span>
        <span class="opt-label">100 numbers</span>
      </button>
      <button class="grid-opt" data-size="12" onclick="selectGrid(this)">
        <span class="opt-size">12×12</span>
        <span class="opt-label">144 numbers</span>
      </button>
    </div>

    <button class="lets-go-btn" onclick="startExplorer()">Let's Go! 🚀</button>
  </div>
</div>

<!-- ══════════════ EXPLORER SCREEN ══════════════ -->
<div id="explorer-screen">

  <div class="top-bar">
    <div class="app-title-small">🔢 Factors and Multiples Explorer</div>
    <div class="mode-btns">
      <button class="mode-btn active" id="btn-factors" onclick="setMode('factors')">🔍 Show Factors</button>
      <button class="mode-btn" id="btn-multiples" onclick="setMode('multiples')">✨ Show Multiples</button>
    </div>
    <button class="back-btn" onclick="goBack()">← Settings</button>
  </div>

  <div class="instruction-banner" id="instruction-text">
    Click any number to see its factors!
  </div>

  <div class="controls-row">
    <div id="multiples-legend" style="display:flex; gap:0.5rem; flex-wrap:wrap; align-items:center;"></div>
    <button class="clear-btn" onclick="clearAll()">✕ Clear All</button>
  </div>

  <div id="grid-wrap">
    <div id="number-grid"></div>
  </div>

</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
let gridSize = 10;
let currentMode = 'factors';    // 'factors' | 'multiples'
let selectedCells = new Set();  // cells with visible factor lists
let activeMultiples = {};       // { number: colorHex }

// ── PALETTE for multiples — ordered so consecutive picks are far apart on the color wheel ──
const PALETTE = [
  '#4361ee', // 1. blue
  '#e63946', // 2. red
  '#2dc653', // 3. green
  '#f4c30a', // 4. yellow
  '#7209b7', // 5. purple
  '#00b4d8', // 6. teal
  '#fb5607', // 7. orange
  '#f72585', // 8. magenta
  '#023e8a', // 9. navy
  '#70e000', // 10. lime
  '#9d4e15', // 11. rust/brown
  '#00f5d4', // 12. cyan-mint
  '#c77dff', // 13. lavender
  '#ee9b00', // 14. amber
  '#386641', // 15. forest green
  '#ff6b9d', // 16. pink
  '#3a86ff', // 17. sky blue
  '#bc4749', // 18. muted red
  '#8338ec', // 19. violet
  '#606c38', // 20. olive
];
let paletteIdx = 0;

function nextColor() {
  const c = PALETTE[paletteIdx % PALETTE.length];
  paletteIdx++;
  return c;
}

// ── UTILS ──────────────────────────────────────────────────────────────────
function getFactors(n) {
  const f = [];
  for (let i = 1; i <= n; i++) {
    if (n % i === 0) f.push(i);
  }
  return f;
}

function selectGrid(el) {
  document.querySelectorAll('.grid-opt').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  gridSize = parseInt(el.dataset.size);
}

// ── START ──────────────────────────────────────────────────────────────────
function startExplorer() {
  document.getElementById('start-screen').style.display = 'none';
  const ex = document.getElementById('explorer-screen');
  ex.style.display = 'flex';
  buildGrid();
  setMode('factors');
  clearAll();
}

function goBack() {
  document.getElementById('explorer-screen').style.display = 'none';
  document.getElementById('start-screen').style.display = 'flex';
  selectedCells.clear();
  activeMultiples = {};
  paletteIdx = 0;
}

// ── SIZE TABLES by grid size ───────────────────────────────────────────────
const SIZE_CONFIG = {
  5:  { cell: 90,  numFull: '1.5rem',  numSmall: '0.85rem', chip: '0.72rem', tri: '20px', dot: '9px'  },
  10: { cell: 72,  numFull: '1.1rem',  numSmall: '0.65rem', chip: '0.58rem', tri: '16px', dot: '7px'  },
  12: { cell: 66,  numFull: '0.95rem', numSmall: '0.58rem', chip: '0.52rem', tri: '14px', dot: '6px'  },
};

// ── BUILD GRID ─────────────────────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('number-grid');
  grid.innerHTML = '';

  const cfg = SIZE_CONFIG[gridSize] || SIZE_CONFIG[10];
  const GAP = 4;
  const totalW = gridSize * cfg.cell + (gridSize - 1) * GAP;

  grid.style.gridTemplateColumns = 'repeat(' + gridSize + ', ' + cfg.cell + 'px)';
  grid.style.width = totalW + 'px';
  grid.className = 'g' + gridSize;

  // Set CSS variables on the grid element
  grid.style.setProperty('--cell-size', cfg.cell + 'px');
  grid.style.setProperty('--num-size', cfg.numFull);
  grid.style.setProperty('--num-size-small', cfg.numSmall);
  grid.style.setProperty('--chip-size', cfg.chip);
  grid.style.setProperty('--tri-size', cfg.tri);
  grid.style.setProperty('--dot-size', cfg.dot);

  const total = gridSize * gridSize;
  for (let i = 1; i <= total; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.n = i;
    cell.id = 'cell-' + i;

    // Number label
    const numEl = document.createElement('div');
    numEl.className = 'cell-number';
    numEl.textContent = i;

    // Factor list container
    const factorDiv = document.createElement('div');
    factorDiv.className = 'factor-list';
    factorDiv.id = 'factors-' + i;

    // Dots layer (for multiples)
    const dotsDiv = document.createElement('div');
    dotsDiv.className = 'dots-layer';
    dotsDiv.id = 'dots-' + i;

    // Corner triangle
    const tri = document.createElement('div');
    tri.className = 'corner-trigger';
    tri.title = 'Show multiples of ' + i;
    tri.onclick = (e) => { e.stopPropagation(); toggleMultiple(i); };

    cell.appendChild(dotsDiv);
    cell.appendChild(numEl);
    cell.appendChild(factorDiv);
    cell.appendChild(tri);

    cell.onclick = () => cellClick(i);

    grid.appendChild(cell);
  }
}

// ── MODE SWITCHING ─────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  const grid = document.getElementById('number-grid');

  if (mode === 'factors') {
    grid.classList.remove('mode-multiples');
    document.getElementById('btn-factors').classList.add('active');
    document.getElementById('btn-multiples').classList.remove('active');
    document.getElementById('instruction-text').textContent = 'Click any number to see its factors!';
    document.getElementById('multiples-legend').style.display = 'none';
  } else {
    // Clear any open factor lists before entering multiples mode
    selectedCells.forEach(n => {
      const cell = document.getElementById('cell-' + n);
      if (cell) cell.classList.remove('selected');
      const fd = document.getElementById('factors-' + n);
      if (fd) fd.innerHTML = '';
    });
    selectedCells.clear();

    grid.classList.add('mode-multiples');
    document.getElementById('btn-multiples').classList.add('active');
    document.getElementById('btn-factors').classList.remove('active');
    document.getElementById('instruction-text').textContent =
      'Click a corner triangle ◹ to highlight all multiples of that number!';
    document.getElementById('multiples-legend').style.display = 'flex';
  }
}

// ── CELL CLICK (factors mode) ──────────────────────────────────────────────
function cellClick(n) {
  if (currentMode !== 'factors') return;

  const cell = document.getElementById('cell-' + n);
  const factorDiv = document.getElementById('factors-' + n);

  if (selectedCells.has(n)) {
    selectedCells.delete(n);
    cell.classList.remove('selected');
    factorDiv.innerHTML = '';
  } else {
    selectedCells.add(n);
    cell.classList.add('selected');

    // Build factor chips
    factorDiv.innerHTML = '';
    const factors = getFactors(n);
    factors.forEach((f, idx) => {
      const chip = document.createElement('span');
      chip.className = 'factor-chip';
      chip.textContent = f + (idx < factors.length - 1 ? ',' : '');
      factorDiv.appendChild(chip);
    });
  }
}

// ── TOGGLE MULTIPLE ────────────────────────────────────────────────────────
function toggleMultiple(n) {
  if (activeMultiples[n]) {
    // Remove this multiple
    delete activeMultiples[n];
    removeDots(n);
    setTriangleColor(n, null);
    updateLegend();
  } else {
    // Add this multiple
    const color = nextColor();
    activeMultiples[n] = color;
    const total = gridSize * gridSize;
    for (let m = n; m <= total; m += n) {
      addDot(m, n, color);
    }
    setTriangleColor(n, color);
    updateLegend();
  }
}

function setTriangleColor(n, color) {
  const cell = document.getElementById('cell-' + n);
  if (!cell) return;
  const tri = cell.querySelector('.corner-trigger');
  if (!tri) return;
  // border-color shorthand: transparent [right-color] transparent transparent
  tri.style.borderColor = color
    ? 'transparent ' + color + ' transparent transparent'
    : 'transparent #94a3b8 transparent transparent';
}

function addDot(cellNum, sourceNum, color) {
  const dotsDiv = document.getElementById('dots-' + cellNum);
  if (!dotsDiv) return;
  const dot = document.createElement('div');
  dot.className = 'm-dot';
  dot.dataset.source = sourceNum;
  dot.style.background = color;
  dot.style.animationDelay = (Math.random() * 0.15) + 's';
  dotsDiv.appendChild(dot);
}

function removeDots(sourceNum) {
  document.querySelectorAll('.m-dot[data-source="' + sourceNum + '"]').forEach(d => d.remove());
}

// ── LEGEND ─────────────────────────────────────────────────────────────────
function updateLegend() {
  const leg = document.getElementById('multiples-legend');
  leg.innerHTML = '';
  if (Object.keys(activeMultiples).length === 0) return;

  const label = document.createElement('span');
  label.style.fontSize = '0.75rem';
  label.style.fontWeight = '800';
  label.style.color = 'var(--muted)';
  label.style.marginRight = '0.25rem';
  label.textContent = 'Showing multiples of:';
  leg.appendChild(label);

  Object.entries(activeMultiples).sort((a,b) => a[0]-b[0]).forEach(([n, color]) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.title = 'Click to remove multiples of ' + n;
    item.onclick = () => toggleMultiple(parseInt(n));

    const dot = document.createElement('div');
    dot.className = 'legend-dot';
    dot.style.background = color;

    const txt = document.createElement('span');
    txt.textContent = n;

    item.appendChild(dot);
    item.appendChild(txt);
    leg.appendChild(item);
  });
}

// ── CLEAR ALL ──────────────────────────────────────────────────────────────
function clearAll() {
  // Clear factors
  selectedCells.forEach(n => {
    const cell = document.getElementById('cell-' + n);
    if (cell) cell.classList.remove('selected');
    const fd = document.getElementById('factors-' + n);
    if (fd) fd.innerHTML = '';
  });
  selectedCells.clear();

  // Clear multiples
  document.querySelectorAll('.m-dot').forEach(d => d.remove());
  Object.keys(activeMultiples).forEach(n => setTriangleColor(parseInt(n), null));
  activeMultiples = {};
  paletteIdx = 0;
  updateLegend();
}
</script>
